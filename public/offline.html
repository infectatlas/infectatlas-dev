<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InfectAtlas - Offline Study Session</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .icon-wrapper {
      margin-bottom: 24px;
      position: relative;
      display: inline-block;
    }

    .logo-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, rgba(99, 102, 241, 0) 70%);
      pointer-events: none;
    }

    svg {
      width: 80px;
      height: 80px;
      color: var(--accent);
      filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4));
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.025em;
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .offline-tip {
      background-color: rgba(99, 102, 241, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #a5b4fc;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .retry-btn:hover {
      background-color: var(--accent-hover);
    }

    .retry-btn:active {
      transform: translateY(1px);
    }

    .connection-status {
      margin-top: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .connection-status::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 6px #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <div class="logo-glow"></div>
      <!-- Custom Microbiological/Atlas Offline Vector Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <ellipse cx="12" cy="12" rx="3" ry="10" />
        <ellipse cx="12" cy="12" rx="10" ry="3" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
        <path d="M2 12a14.5 14.5 0 0 0 20 0 14.5 14.5 0 0 0-20 0" />
        <circle cx="9" cy="9" r="0.75" fill="currentColor" />
        <circle cx="15" cy="15" r="0.75" fill="currentColor" />
        <circle cx="14" cy="8" r="0.5" fill="currentColor" />
        <circle cx="8" cy="14" r="0.5" fill="currentColor" />
      </svg>
    </div>
    <h1>Connection Interrupted</h1>
    <p>InfectAtlas requires an active internet connection to synchronize board clinical data, download atlas guides, and compile dynamic medical simulations.</p>
    
    <div class="offline-tip">
      <svg style="width: 16px; height: 16px; color: #a5b4fc; filter: none; margin: 0;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="16" x2="12" y2="12" />
        <line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
      <span>Tip: Check your local cellular data or WiFi router.</span>
    </div>

    <button onclick="window.location.reload();" class="retry-btn">
      Verify Status & Refresh
    </button>
    
    <div class="connection-status">Currently Offline</div>
  </div>
</body>
</html>
